## Thin caller -- the matrix, system dependencies, caching, Drive staging
## and the check itself all live in PredictiveEcology/actions. This file only
## says which package to check and what it needs on top of the org defaults.
##
## Pinned @main deliberately: tags freeze and rot (v0.1/v0.2 kept the
## ubuntugis PPA for months after the workflows rejected it). The actions repo
## gates merges with its own self-test CI.

name: R-CMD-check

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  R-CMD-check:
    uses: PredictiveEcology/actions/.github/workflows/R-CMD-check.yaml@main
    with:
      ## DESCRIPTION is the single source of truth: "all" installs
      ## Depends/Imports/LinkingTo *and* Suggests, so there is no
      ## extra-packages list to keep in sync (any::rcmdcheck is added by the
      ## reusable workflow itself).
      ##
      ## This used to be '"hard"' plus 16 hand-listed Suggests, working around
      ## a pak solver bug -- an inconsistent Matrix entry (R>=4.7 from
      ## /src/contrib/4.7.0/Recommended coexisting with R>=4.4 from the main
      ## path) that only surfaced when Suggests was traversed transitively.
      ## Retested in #37: 12/12 green on every platform and R version incl.
      ## devel. The CRAN metadata that caused it has moved on. If a pak
      ## resolve error naming Matrix ever returns, that workaround is the fix.
      dependencies: '"all"'
      ## Legs beyond the org default 8. These still work and are
      ## deliberate back-compat coverage, so they are preserved.
      extra-config: |
        [{"config": {"os": "ubuntu-latest", "nosuggests": false, "r": "oldrel-2"}}, {"config": {"os": "windows-latest", "nosuggests": false, "r": "oldrel-2"}}]
