## Thin caller -- the runner, geospatial system dependencies, dependency
## resolution, caching and covr itself all live in PredictiveEcology/actions.
## This file only says when to run and which secrets to pass.
##
## Pinned @main deliberately: tags freeze and rot (v0.1/v0.2 kept the ubuntugis
## PPA for months after the workflows rejected it). The actions repo gates
## merges with its own self-test CI.
##
## Replaces a 71-line bespoke workflow. Everything it customised is either the
## reusable workflow's default or one of its inputs:
##   - dependencies: '"all"'          -> the workflow's default, so not repeated here
##   - extra-packages: any::covr      -> added by the workflow itself
##   - brew install gdal/pkg-config   -> `system-deps` (default true), stock Noble apt
##   - extra-repositories, Ncpus: 2   -> identical in the workflow
##   - hand-rolled actions/cache      -> setup-r-dependencies@v2 caches natively

name: test-coverage

on:
  push:
    ## Was [master, development]. This repo's default branch is `main`, so
    ## coverage never ran on it -- and a codecov badge only reports for a
    ## branch the workflow actually runs on.
    branches: [main, development]
  pull_request:
    branches: [main, development]

concurrency:
  ## Group by github.ref so a PR run and a branch-push run never share a group.
  ## Never cancel a push/merge run: covr takes ~25 min and merges can land
  ## minutes apart, so cancelling one surfaces as spurious red. The bespoke
  ## workflow had `cancel-in-progress: true` unconditionally.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-coverage:
    uses: PredictiveEcology/actions/.github/workflows/test-coverage.yaml@main
    secrets:
      GOOGLEDRIVE_AUTH: ${{ secrets.GOOGLEDRIVE_AUTH }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
