on:
  push:
    branches:
      - master
      - development
  pull_request:
    branches:
      - master
      - development

name: test-coverage

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-coverage:
    runs-on: macOS-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      GOOGLEDRIVE_AUTH: ${{ secrets.GOOGLEDRIVE_AUTH }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      USING_COVR: true

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Install macOS system dependencies
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config
          brew install gdal

      - uses: r-lib/actions/setup-r@v2
        with:
          extra-repositories: 'https://predictiveecology.r-universe.dev/'
          Ncpus: 2
          # macOS runner -- `use-public-rspm` is a no-op anyway, but
          # set to false to match R-CMD-check.yaml.
          use-public-rspm: false

      # Cache the resolved R user library so transient GitHub-API
      # failures during pak dependency resolution still leave a usable
      # library for the coverage run. See R-CMD-check.yaml for rationale.
      - name: Restore R library cache
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-${{ runner.arch }}-coverage-deps-${{ hashFiles('DESCRIPTION') }}-v1
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-coverage-deps-

      # `continue-on-error` so a transient pak failure does not abort the
      # job while the restored cache still has a usable library.
      - id: deps
        continue-on-error: true
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # "all" installs Suggests from DESCRIPTION, so tests under
          # coverage get the same packages they would in R CMD check,
          # with no mirrored list to keep in sync. Was '"hard"' plus a
          # hand-mirrored Suggests list, working around a pak Matrix
          # metadata bug; retested green in #37. See R-CMD-check.yaml.
          dependencies: '"all"'
          extra-packages: any::covr

      - name: Test coverage
        run: covr::codecov()
        shell: Rscript {0}
